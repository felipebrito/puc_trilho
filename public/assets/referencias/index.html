<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referências PUC - Trilho</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4ade80;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .card p {
            margin: 5px 0;
            font-size: 0.9em;
            color: #a3a3a3;
        }
        .card .filename {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .copy-btn {
            background-color: #4ade80;
            color: #1a1a1a;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .copy-btn:hover {
            background-color: #22c55e;
        }
    </style>
</head>
<body>
    <h1>Páginas de Referência</h1>
    <p style="text-align: center; color: #a3a3a3;">Você pode usar os nomes dos arquivos ou caminhos abaixo para se referir a uma página específica.</p>
    
    <div class="gallery">
        <script>
            // Gerar dinamicamente os 62 cards
            const gallery = document.querySelector('.gallery');
            for (let i = 1; i <= 62; i++) {
                const pageNum = i.toString().padStart(2, '0');
                const filename = `page-${pageNum}.jpg`;
                const url = `http://localhost:8000/${filename}`;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${filename}" alt="Página ${pageNum}" loading="lazy">
                    <div class="filename">${filename}</div>
                    <p>Caminho local:</p>
                    <p style="font-size: 0.8em; word-break: break-all;">/Users/brito/Desktop/puc_trilho/_conteudo/referencias/${filename}</p>
                `;
                gallery.appendChild(card);
            }
        </script>
    </div>
</body>
</html>
